services:
  vidfactory:
    image: ghcr.io/think4dvantage/vidfactory:latest
    restart: unless-stopped
    volumes:
      - ./config.yml:/app/config.yml:ro
      # NAS share //172.18.10.10/pg mounted on the host at /mnt/pg.
      - /mnt/pg:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - proxy

networks:
  proxy:
    external: true
