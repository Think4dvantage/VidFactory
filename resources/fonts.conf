<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Container fonts (installed via apt: fonts-liberation, fonts-dejavu). -->
  <dir>/usr/share/fonts</dir>
  <cachedir>/tmp/fontconfig</cachedir>
  <!-- Liberation Sans/Mono are metric-compatible stand-ins for Arial used by the CTA drawtext. -->
  <alias><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Arial Black</family><prefer><family>Liberation Sans Bold</family></prefer></alias>
</fontconfig>
