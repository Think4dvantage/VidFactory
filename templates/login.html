{% extends "base.html" %}
{% block title %}VidFactory — Login{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-12">
  <h1 class="text-xl font-semibold mb-4">Sign in</h1>
  {% if error %}<p class="text-rose-400 text-sm mb-3">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="space-y-3">
    <label class="block text-sm">Username
      <input type="text" name="username" autofocus required
             class="mt-1 w-full rounded bg-slate-900 border border-slate-600 px-2 py-1"></label>
    <label class="block text-sm">Password
      <input type="password" name="password" required
             class="mt-1 w-full rounded bg-slate-900 border border-slate-600 px-2 py-1"></label>
    <button class="w-full rounded bg-sky-700 hover:bg-sky-600 px-3 py-2 text-sm">Sign in</button>
  </form>
</div>
{% endblock %}
