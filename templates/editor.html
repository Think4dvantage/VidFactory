{% extends "base.html" %}
{% block title %}VidFactory — Highlight Editor{% endblock %}
{% block content %}
<div class="mb-3 flex items-center justify-between">
  <div>
    <a href="/projects/{{ project.id }}" class="text-sm text-sky-300 hover:underline">← Project</a>
    <h1 class="text-xl font-semibold mt-1">Highlight Editor
      {% if outing %}<span class="text-slate-400 text-sm">— {{ outing.date }}</span>{% endif %}
    </h1>
  </div>
  <div class="text-xs text-slate-400">Space = play/pause · I = set IN · O = set OUT</div>
</div>

<div id="editor" data-project="{{ project.id }}">
  <video id="player" class="w-full max-h-[55vh] bg-black rounded" preload="metadata"
         src="/api/projects/{{ project.id }}/fullflight/video" controls></video>

  <canvas id="timeline" height="44" class="w-full mt-2 rounded bg-slate-800 cursor-pointer"></canvas>

  <div class="grid gap-4 lg:grid-cols-2 mt-4">
    <!-- Mark form -->
    <section class="rounded-lg border border-slate-700 bg-slate-800 p-4">
      <h2 class="text-xs uppercase tracking-wide text-slate-400 mb-2">Mark highlight</h2>
      <div class="flex items-center gap-2 mb-2 text-sm">
        <button id="set-in" class="rounded bg-slate-700 hover:bg-slate-600 px-2 py-1">[I] Set IN</button>
        <span>IN <b id="in-label">—</b></span>
        <button id="set-out" class="rounded bg-slate-700 hover:bg-slate-600 px-2 py-1">[O] Set OUT</button>
        <span>OUT <b id="out-label">—</b></span>
      </div>
      <input type="hidden" id="edit-id">
      <div class="grid gap-2 text-sm">
        <label class="flex flex-col">Name
          <input id="f-name" class="rounded bg-slate-900 border border-slate-600 px-2 py-1"></label>
        <label class="flex flex-col">Comment (overlay)
          <input id="f-comment" class="rounded bg-slate-900 border border-slate-600 px-2 py-1"></label>
        <div class="flex gap-4">
          <label class="flex items-center gap-1">Role
            <select id="f-role" class="rounded bg-slate-900 border border-slate-600 px-2 py-1">
              <option value="normal">normal</option>
              <option value="launch">launch</option>
              <option value="landing">landing</option>
            </select></label>
          <label class="flex items-center gap-1"><input type="checkbox" id="f-summary" checked> use in summary</label>
          <label class="flex items-center gap-1"><input type="checkbox" id="f-short"> make short</label>
        </div>
        <div class="flex gap-2">
          <button id="save-btn" class="rounded bg-emerald-700 hover:bg-emerald-600 px-3 py-1">Add highlight</button>
          <button id="cancel-btn" class="rounded bg-slate-700 hover:bg-slate-600 px-3 py-1 hidden">Cancel edit</button>
        </div>
      </div>
    </section>

    <!-- List -->
    <section class="rounded-lg border border-slate-700 bg-slate-800 p-4">
      <h2 class="text-xs uppercase tracking-wide text-slate-400 mb-2">Highlights (<span id="count">0</span>)</h2>
      <div id="hl-list" class="text-sm divide-y divide-slate-700/60 max-h-[50vh] overflow-y-auto"></div>
    </section>
  </div>
</div>

<script src="/static/editor.js" defer></script>
{% endblock %}
