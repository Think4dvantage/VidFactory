services:
  vidfactory:
    build: .
    image: vidfactory:dev
    volumes:
      - ./src:/app/src:ro,z
      - ./templates:/app/templates:ro,z
      - ./static:/app/static:ro,z
      - ./resources:/app/resources:ro,z
      - /mnt/pg:/data
    environment:
      - PYTHONPYCACHEPREFIX=/tmp/pycache
    # GPU: Intel QSV via /dev/dri (works today). The encoder detector picks
    # QSV when available, else libx264.
    devices:
      - /dev/dri:/dev/dri
    # NVENC: re-enable once the host NVIDIA Container Toolkit is repaired — it currently
    # references a missing driver lib (libEGL_nvidia.so.<ver>), so the container fails to
    # start when this block is active. Fix on host (e.g. `sudo nvidia-ctk runtime configure`
    # + reinstall matching driver) then uncomment. NVENC needs only compute,utility,video.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [compute, utility, video]
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vidfactory-dev.rule=Host(`vf-dev.lg4.ch`)"
      - "traefik.http.routers.vidfactory-dev.entrypoints=websecure"
      - "traefik.http.routers.vidfactory-dev.tls=true"
      - "traefik.http.routers.vidfactory-dev.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vidfactory-dev.service=vidfactory-dev"
      - "traefik.http.services.vidfactory-dev.loadbalancer.server.port=8000"
      - "traefik.docker.network=proxy"

networks:
  proxy:
    external: true
