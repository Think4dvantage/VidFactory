services:
  vidfactory:
    build: .
    image: vidfactory:dev
    volumes:
      - ./src:/app/src:ro,z
      - ./templates:/app/templates:ro,z
      - ./static:/app/static:ro,z
      - ./resources:/app/resources:ro,z
      - /mnt/pg:/data
      # SQLite DB on a LOCAL volume (WAL mode is unsafe on the NFS share).
      - vf_data:/app/data
      # Uploaded raw source video — local disk, independent of NAS availability.
      - vf_uploads:/app/uploads
    environment:
      - PYTHONPYCACHEPREFIX=/tmp/pycache
      - VF_DATA_DIR=/app/data
      - VF_UPLOADS_DIR=/app/uploads
      # Folder names on the share are lowercase.
      - VF_MUSIC=/data/music
      - VF_OUTPUT_SUMMARIES=/data/summaries
      - VF_OUTPUT_SHORTS=/data/shorts
    # GPU: NVIDIA NVENC via CDI (nvidia.com/gpu=all) + Intel QSV via /dev/dri.
    # The encoder detector prefers NVENC, then QSV, then libx264. The CDI device
    # requires an up-to-date /etc/cdi/nvidia.yaml on the host
    # (regenerate after driver updates: `sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml`).
    devices:
      - /dev/dri:/dev/dri
      - nvidia.com/gpu=all
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vidfactory-dev.rule=Host(`vf-dev.lg4.ch`)"
      - "traefik.http.routers.vidfactory-dev.entrypoints=websecure"
      - "traefik.http.routers.vidfactory-dev.tls=true"
      - "traefik.http.routers.vidfactory-dev.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vidfactory-dev.service=vidfactory-dev"
      - "traefik.http.services.vidfactory-dev.loadbalancer.server.port=8000"
      - "traefik.docker.network=proxy"

volumes:
  vf_data:
  vf_uploads:

networks:
  proxy:
    external: true
